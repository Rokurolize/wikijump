name: Consolidated validation

# The full consolidated validation suite runs here as an INFORMATIONAL
# signal only: nightly on develop and on manual dispatch. It is not a
# pull-request check and nothing may gate a merge or a promotion on it -
# merge evidence is the fast targeted checks in pr-checks.yml. This
# workflow runs
# install/local/wikidot-verification/scripts/run-consolidated-validation.mjs
# (the same runner, unmodified), seals the same receipt it seals locally,
# and uploads it as an artifact for inspection.
# install/standing/scripts/fetch-ci-validation-receipt.mjs can land a CI
# receipt in the local validation store.
#
# A group whose inputs are local state cannot run here. Such groups are
# absent from this run and the job summary names them loudly; they run
# locally when a change actually touches them. Today the only local-only
# group is:
#   theme_lab - its evidence lives in the local Theme Lab authority
#               object store (~/.local/state/wikijump/theme-lab), which
#               is not in Git and is not published anywhere a runner
#               could fetch. The group fails closed without the store.
#
# One check inside the verification group is likewise local-only: the
# wikidot specification generator reads the scp-wiki-translation
# documentation corpus (WIKIDOT_DOCUMENTATION_CORPUS), which is operator
# data in no Git repository. It fails in CI for that reason alone; the
# run's receipt records it, and this is expected, not a regression.
#
# The standing application images are not built here: the runner is
# invoked with its own --no-image-build flag because the
# docker-build-*.yaml workflows already build those images on pull
# requests, and promote.py does not require the image check in a receipt
# it reuses. Local promotion runs still build them.

on:
  schedule:
    # Nightly on develop (03:17 JST). Informational only.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      groups:
        description: "Comma-separated groups to run (default: selected by the diff)"
        required: false
        type: string
      base:
        description: "Base commit or ref to diff against (default: origin/develop)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Nightly runs serialize per ref; a manual dispatch is an intentional
  # separate run and gets its own group, so dispatching one informational
  # run never cancels another.
  group: consolidated-validation-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'nightly' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Consolidated validation
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      WIKIJUMP_FTML_CHECKOUT: ${{ github.workspace }}/ftml
      WIKIDOT_PY_CHECKOUT: ${{ github.workspace }}/wikidot.py
      THEME_LAB_TEST_CONCURRENCY: "4"
      # A hosted runner has 4 cores; the local default of 12 task-owned
      # Deepwell stacks would thrash it. Same tests, fewer stacks at once.
      WIKIJUMP_DEEPWELL_TEST_SHARDS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Check out the head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wikijump
          fetch-depth: 0

      - name: Resolve the base and the pinned FTML revision
        id: pins
        working-directory: wikijump
        run: |
          set -euo pipefail
          git fetch origin develop
          base='${{ inputs.base }}'
          if [ -z "$base" ]; then base="$(git rev-parse origin/develop)"; fi
          echo "base=$(git rev-parse "${base}^{commit}")" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The FTML revision the tree pins lives in deepwell/Cargo.lock as
          # the ftml package's git source revision; the verification
          # tooling extracts it the same way (ftmlPin()).
          ftml_rev="$(sed -n '/^name = "ftml"$/,/^$/p' deepwell/Cargo.lock | grep -oE '[0-9a-f]{40}' | head -1)"
          test -n "$ftml_rev"
          echo "ftml_rev=$ftml_rev" >> "$GITHUB_OUTPUT"
          # The wikidot.py revision the tree pins is the supported-source
          # lock the inventory tooling itself reads.
          wikidot_py_rev="$(node -e 'const fs = require("fs"); const v = JSON.parse(fs.readFileSync("docs/development/wikidot-py-supported-source.json", "utf8")); if (v.schema !== "wikijump.wikidot_py_supported_source.v1" || !/^[0-9a-f]{40}$/.test(v.commit ?? "")) process.exit(1); process.stdout.write(v.commit)')"
          test -n "$wikidot_py_rev"
          echo "wikidot_py_rev=$wikidot_py_rev" >> "$GITHUB_OUTPUT"
          echo "Base: $base  FTML: $ftml_rev  Head: $(git rev-parse HEAD)"

      - name: Check out FTML at the pinned revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Rokurolize/ftml
          path: ftml
          ref: ${{ steps.pins.outputs.ftml_rev }}
          fetch-depth: 0

      - name: Check out wikidot.py at the pinned revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Rokurolize/wikidot.py
          path: wikidot.py
          ref: ${{ steps.pins.outputs.wikidot_py_rev }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          # Both packages pin pnpm@11.10.0; activate exactly that version,
          # or Corepack serves its own default and pnpm refuses with
          # ERR_PNPM_BAD_PM_VERSION.
          corepack prepare pnpm@11.10.0 --activate

      - name: Install the pinned Rust toolchain
        working-directory: wikijump
        run: |
          rustup toolchain install 1.95.0 --component clippy,rustfmt,rust-src
          rustup show active-toolchain

      - name: Install sqlx-cli and cargo-machete
        run: |
          set -euo pipefail
          # sqlx-cli matches the sqlx version in deepwell/Cargo.lock
          # (0.9.0); preflight refuses the Deepwell group without sqlx.
          cargo install sqlx-cli --version 0.9.0 --locked
          machete="cargo-machete-v0.9.2-x86_64-unknown-linux-musl"
          curl -fsSLO "https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/${machete}.tar.gz"
          curl -fsSLO "https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/${machete}.tar.gz.sha256"
          # The upstream .sha256 asset is a bare hash with no filename,
          # so compare it directly instead of sha256sum --check.
          test "$(tr -d '[:space:]' < "${machete}.tar.gz.sha256")" = "$(sha256sum "${machete}.tar.gz" | cut -d ' ' -f 1)"
          tar -xzf "${machete}.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "${machete}/cargo-machete"
          sqlx --version
          cargo machete --version

      - name: Install system build dependencies
        run: |
          # deepwell's filemagic dependency probes libmagic via
          # pkg-config at build time; the WSL has it, a bare runner does
          # not.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmagic-dev

      - name: Start sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache the Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('wikijump/deepwell/Cargo.lock', 'wikijump/wws/Cargo.lock', 'wikijump/locales/validator/Cargo.lock', 'ftml/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('wikijump/framerail/pnpm-lock.yaml', 'wikijump/install/local/wikidot-verification/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install JavaScript dependencies
        run: |
          pnpm --dir wikijump/framerail install --frozen-lockfile
          pnpm --dir wikijump/install/local/wikidot-verification install --frozen-lockfile

      - name: Fetch Cargo dependencies
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo fetch --locked --manifest-path wikijump/deepwell/Cargo.toml
          cargo fetch --locked --manifest-path wikijump/wws/Cargo.toml
          cargo fetch --locked --manifest-path wikijump/locales/validator/Cargo.toml
          # The FTML repository tracks no Cargo.lock (library convention),
          # so its fetch cannot be --locked; it only warms the crates.io
          # dependencies the contract canary builds against.
          cargo fetch --manifest-path ftml/Cargo.toml

      - name: Register the runner hostname locally
        run: |
          # The test network guard treats resolving the machine's own
          # hostname through DNS as an external attempt (a local-path
          # git clone in the standing tests triggers it). Resolving the
          # hostname via /etc/hosts is the local configuration the guard
          # expects; genuinely external connects stay blocked.
          echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts

      - name: Plan the selected groups
        id: plan
        working-directory: wikijump
        run: |
          set -euo pipefail
          base='${{ steps.pins.outputs.base }}'
          requested='${{ inputs.groups }}'
          if [ -z "$requested" ] && [ '${{ github.event_name }}' = 'schedule' ]; then
            requested='deepwell,wws,framerail,locales,workflow,verification'
          fi
          list="$(scripts/preflight.sh --base "$base" --final --list)"
          echo "$list"
          groups_line="$(grep '^preflight: groups: ' <<<"$list" | sed 's/^preflight: groups: //')"
          declare -A sel=()
          for pair in $groups_line; do sel["${pair%%=*}"]="${pair##*=}"; done
          if [ -n "$requested" ]; then
            for g in "${!sel[@]}"; do sel[$g]=false; done
            IFS=',' read -ra want <<<"$requested"
            for g in "${want[@]}"; do
              if [ -z "${sel[$g]+set}" ]; then echo "::error::unknown group in the groups input: $g"; exit 1; fi
              sel[$g]=true
            done
          fi
          # Groups whose inputs are local state and cannot run on a
          # hosted runner. Keep this list honest: a group belongs here
          # only with its blocker recorded in the workflow header.
          local_only="theme_lab"
          run_groups=()
          skipped=()
          selected=()
          for g in deepwell wws framerail locales workflow theme_lab verification; do
            if [ "${sel[$g]:-false}" = "true" ]; then
              selected+=("$g")
              case " $local_only " in
                *" $g "*) skipped+=("$g") ;;
                *) run_groups+=("$g") ;;
              esac
            fi
          done
          join_by() { local IFS="$1"; shift; echo "$*"; }
          echo "run_groups=$(join_by , "${run_groups[@]}")" >> "$GITHUB_OUTPUT"
          echo "skipped_groups=$(join_by , "${skipped[@]}")" >> "$GITHUB_OUTPUT"
          {
            echo "## Consolidated validation plan (informational - not a merge gate)"
            echo ""
            echo "- Base: \`$base\`"
            echo "- Selected groups: \`$(join_by ', ' "${selected[@]}")\`"
            echo "- Groups run in CI: \`$(join_by ', ' "${run_groups[@]}")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#skipped[@]}" -gt 0 ]; then
            {
              echo ""
              echo "### Local-only groups selected but not run in CI"
              echo ""
              for g in "${skipped[@]}"; do echo "- \`$g\`"; done
              echo ""
              echo "These groups' inputs are local state (see the workflow header), so this informational run does **not** cover them; they are exercised locally when a change touches them."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Local-only validation groups::Selected but not run in CI: $(join_by ', ' "${skipped[@]}"). These groups run locally; this informational run does not cover them."
          fi

      - name: Build the Deepwell integration images
        if: contains(steps.plan.outputs.run_groups, 'deepwell')
        working-directory: wikijump
        run: |
          # The Deepwell test stacks run only the project's pre-built
          # backing-service images and refuse to pull during the hermetic
          # barrier; build them here, in setup, where pulling the base
          # images is allowed.
          bash scripts/build-deepwell-integration-images.sh

      - name: Run the consolidated validation
        id: gate
        if: steps.plan.outputs.run_groups != ''
        working-directory: wikijump
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          base='${{ steps.pins.outputs.base }}'
          head='${{ steps.pins.outputs.head }}'
          out="$RUNNER_TEMP/receipt/validation-ci-${head:0:12}.json"
          mkdir -p "$RUNNER_TEMP/receipt"
          echo "receipt_path=$out" >> "$GITHUB_OUTPUT"
          args=(--repository "$PWD" --base "$base" --output "$out" --no-image-build)
          # The plan step's output is the final selection (diff, input, or
          # the nightly set) with local-only groups already removed.
          args+=(--groups '${{ steps.plan.outputs.run_groups }}')
          node install/local/wikidot-verification/scripts/run-consolidated-validation.mjs "${args[@]}"

      - name: Upload the sealed receipt
        if: always() && steps.plan.outputs.run_groups != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consolidated-validation-${{ steps.pins.outputs.head }}
          path: |
            ${{ runner.temp }}/receipt/validation-ci-*.json
            ${{ runner.temp }}/receipt/validation-ci-*.json.log
          if-no-files-found: warn
          retention-days: 90

      - name: Summarize the receipt
        if: always() && steps.plan.outputs.run_groups != ''
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          const dir = path.join(process.env.RUNNER_TEMP, "receipt");
          const file = fs.readdirSync(dir).find((name) => name.endsWith(".json"));
          const lines = ["", "## Consolidated validation result", ""];
          if (!file) {
            lines.push("No receipt was sealed; the gate step failed before sealing. See the gate log.");
          } else {
            const receipt = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8"));
            lines.push(`- Receipt: \`${file}\``);
            lines.push(`- Status: **${receipt.status}**`);
            lines.push(`- Head: \`${receipt.wikijump_commit}\` (tree \`${receipt.wikijump_tree}\`)`);
            lines.push(`- Base: \`${receipt.base_commit}\``);
            lines.push("");
            lines.push("| Check | Result | Seconds |");
            lines.push("| --- | --- | --- |");
            for (const check of receipt.checks) {
              lines.push(`| ${check.name} | ${check.status} | ${check.duration_seconds ?? ""} |`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          EOF
