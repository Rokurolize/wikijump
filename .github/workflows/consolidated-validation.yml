name: Consolidated validation

# The full preflight barrier runs here as an informational signal only:
# nightly on develop and on manual dispatch. Merge evidence is the fast
# targeted checks in pr-checks.yml. The standing application images are not
# built here because the docker-build-*.yaml workflows already build them.

on:
  schedule:
    # Nightly on develop (03:17 JST). Informational only.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      groups:
        description: "Comma-separated groups to run (default: selected by the diff)"
        required: false
        type: string
      base:
        description: "Base commit or ref to diff against (default: origin/develop)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Nightly runs serialize per ref; a manual dispatch is an intentional
  # separate run and gets its own group, so dispatching one informational
  # run never cancels another.
  group: consolidated-validation-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'nightly' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Consolidated validation
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      THEME_LAB_TEST_CONCURRENCY: "4"
      # A hosted runner has 4 cores; the local default of 12 task-owned
      # Deepwell stacks would thrash it. Same tests, fewer stacks at once.
      WIKIJUMP_DEEPWELL_TEST_SHARDS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Check out the head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wikijump
          fetch-depth: 0

      - name: Resolve the base
        id: pins
        working-directory: wikijump
        run: |
          set -euo pipefail
          git fetch origin develop
          base='${{ inputs.base }}'
          if [ -z "$base" ]; then base="$(git rev-parse origin/develop)"; fi
          echo "base=$(git rev-parse "${base}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          # Both packages pin pnpm@11.10.0; activate exactly that version,
          # or Corepack serves its own default and pnpm refuses with
          # ERR_PNPM_BAD_PM_VERSION.
          corepack prepare pnpm@11.10.0 --activate

      - name: Install the pinned Rust toolchain
        working-directory: wikijump
        run: |
          # The channel and components come from the tree's own
          # rust-toolchain.toml, so a toolchain bump needs no workflow
          # change.
          channel="$(sed -n 's/^channel = "\([0-9.]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --component clippy,rustfmt,rust-src
          rustup default "$channel"
          rustup show active-toolchain

      - name: Install sqlx-cli and cargo-machete
        run: |
          set -euo pipefail
          # sqlx-cli matches the sqlx version in deepwell/Cargo.lock
          # (0.9.0); preflight refuses the Deepwell group without sqlx.
          cargo install sqlx-cli --version 0.9.0 --locked
          machete="cargo-machete-v0.9.2-x86_64-unknown-linux-musl"
          curl -fsSLO "https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/${machete}.tar.gz"
          curl -fsSLO "https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/${machete}.tar.gz.sha256"
          # The upstream .sha256 asset is a bare hash with no filename,
          # so compare it directly instead of sha256sum --check.
          test "$(tr -d '[:space:]' < "${machete}.tar.gz.sha256")" = "$(sha256sum "${machete}.tar.gz" | cut -d ' ' -f 1)"
          tar -xzf "${machete}.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "${machete}/cargo-machete"
          sqlx --version
          cargo machete --version
          # The Deepwell integration shards run under cargo-nextest;
          # install the same release the local environment uses.
          nextest="cargo-nextest-0.9.138-x86_64-unknown-linux-gnu"
          curl -fsSLO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.138/${nextest}.tar.gz"
          curl -fsSLO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.138/${nextest}.sha256"
          test "$(cut -d ' ' -f 1 < "${nextest}.sha256")" = "$(sha256sum "${nextest}.tar.gz" | cut -d ' ' -f 1)"
          mkdir -p /tmp/nextest-bin
          tar -xzf "${nextest}.tar.gz" -C /tmp/nextest-bin
          install -m 0755 "$(find /tmp/nextest-bin -name cargo-nextest -type f | head -1)" "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version

      - name: Install system build dependencies
        run: |
          # deepwell's filemagic dependency probes libmagic via
          # pkg-config at build time; the WSL has it, a bare runner does
          # not.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmagic-dev

      - name: Start sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache the Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('wikijump/deepwell/Cargo.lock', 'wikijump/wws/Cargo.lock', 'wikijump/locales/validator/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('wikijump/framerail/pnpm-lock.yaml', 'wikijump/install/local/wikidot-verification/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install JavaScript dependencies
        run: |
          pnpm --dir wikijump/framerail install --frozen-lockfile
          pnpm --dir wikijump/install/local/wikidot-verification install --frozen-lockfile

      - name: Fetch Cargo dependencies
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo fetch --locked --manifest-path wikijump/deepwell/Cargo.toml
          cargo fetch --locked --manifest-path wikijump/wws/Cargo.toml
          cargo fetch --locked --manifest-path wikijump/locales/validator/Cargo.toml
          # The Deepwell fetch also warms the crates.io dependencies of the
          # pinned FTML git dependency, so no separate FTML checkout is
          # needed here.

      - name: Configure the runner's git identity
        run: |
          # Ambient precondition parity with the coordinator's machine:
          # with no git identity configured, git's clone ident heuristic
          # resolves the machine's own hostname, which the test network
          # guard (by design) treats as an external lookup and flags the
          # standing test suite as non-hermetic. A configured identity -
          # as the local environment has - never takes that path. The
          # guard still blocks every genuinely external connect.
          git config --global user.email "ci@localhost"
          git config --global user.name "wikijump-ci"

      - name: Plan the selected groups
        id: plan
        working-directory: wikijump
        run: |
          set -euo pipefail
          base='${{ steps.pins.outputs.base }}'
          requested='${{ inputs.groups }}'
          if [ -z "$requested" ] && [ '${{ github.event_name }}' = 'schedule' ]; then
            requested='deepwell,wws,framerail,locales,workflow,verification'
          fi
          list="$(scripts/preflight.sh --base "$base" --final --list)"
          echo "$list"
          groups_line="$(grep '^preflight: groups: ' <<<"$list" | sed 's/^preflight: groups: //')"
          declare -A sel=()
          for pair in $groups_line; do sel["${pair%%=*}"]="${pair##*=}"; done
          if [ -n "$requested" ]; then
            for g in "${!sel[@]}"; do sel[$g]=false; done
            IFS=',' read -ra want <<<"$requested"
            for g in "${want[@]}"; do
              if [ -z "${sel[$g]+set}" ]; then echo "::error::unknown group in the groups input: $g"; exit 1; fi
              sel[$g]=true
            done
          fi
          run_groups=()
          for g in deepwell wws framerail locales workflow theme_lab verification; do
            if [ "${sel[$g]:-false}" = "true" ]; then run_groups+=("$g"); fi
          done
          joined="$(IFS=,; echo "${run_groups[*]}")"
          echo "run_groups=$joined" >> "$GITHUB_OUTPUT"
          echo "Consolidated validation groups: \`$joined\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the Deepwell integration images
        if: contains(steps.plan.outputs.run_groups, 'deepwell') || contains(steps.plan.outputs.run_groups, 'wws')
        working-directory: wikijump
        run: |
          # The Deepwell test stacks run only the project's pre-built
          # backing-service images and refuse to pull during the hermetic
          # barrier; build them here, in setup, where pulling the base
          # images is allowed.
          bash scripts/build-deepwell-integration-images.sh

      - name: Start the ambient Valkey the WWS tests expect
        if: contains(steps.plan.outputs.run_groups, 'wws')
        run: |
          # Two WWS avatar tests build their state with
          # redis://127.0.0.1/ (the default port) and exercise the
          # cache-miss path: with nothing listening, the cache call
          # errors and the handler takes the wrong error branch. The
          # local environment has the dev cache there; CI runs the
          # project's own Valkey image on the same port.
          docker run -d --name ci-wws-cache -p 127.0.0.1:6379:6379 wikijump-local-development-cache
          for attempt in $(seq 1 30); do
            if docker exec ci-wws-cache valkey-cli ping 2>/dev/null | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "ambient valkey did not come up" >&2
          exit 1

      - name: Run the consolidated validation
        if: steps.plan.outputs.run_groups != ''
        working-directory: wikijump
        env:
          RUSTC_WRAPPER: sccache
        run: scripts/preflight.sh --base '${{ steps.pins.outputs.base }}' --final --jobs 0 --groups '${{ steps.plan.outputs.run_groups }}'
