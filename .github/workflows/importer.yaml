name: '[python] Importer Scripts'

on:
  pull_request:
    paths:
      - 'deepwell/importer/*.py'
      - '.github/workflows/importer.yaml'
  push:
    branches:
      - develop
      - prod

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # update this as needed
        python-version:
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: cd deepwell/importer && python -m pip install -r requirements-dev.txt

      - name: ruff format
        run: cd deepwell && ruff format --check importer

      - name: ruff check
        run: cd deepwell && ruff check importer

      - name: mypy
        run: cd deepwell && mypy importer
