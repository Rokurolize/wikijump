name: '[backend] Docker build Silo (local)'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install/local/silo/*'
      - '.github/workflows/docker-build-silo.local.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Build image
        run: cd install/local/silo && docker build .
        env:
          DOCKER_BUILDKIT: 1
