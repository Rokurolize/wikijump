name: '[ci] Codex Cloud scripts'

on:
  pull_request:
    paths:
      - '.github/workflows/codex-cloud.yaml'
      - 'docs/CodexCloudEnvironment.md'
      - 'scripts/codex-cloud-*.sh'
      - 'scripts/codex_cloud_test.py'
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/codex-cloud.yaml'
      - 'docs/CodexCloudEnvironment.md'
      - 'scripts/codex-cloud-*.sh'
      - 'scripts/codex_cloud_test.py'
  workflow_dispatch:

permissions: {}

jobs:
  scripts:
    name: Validate scripts
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Local-validation-only policy
        run: |
          printf '%s\n' \
            'Codex Cloud script validation is intentionally disabled in GitHub Actions.' \
            'Run Bash syntax, ShellCheck, and regression tests in the maintained local workspace.'
