name: '[backend] Docker build Framerail (local)'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install/local/framerail/Dockerfile'
      - '.github/workflows/docker-build-framerail.local.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build image
        run: docker build -f install/local/framerail/Dockerfile .
        env:
          DOCKER_BUILDKIT: 1
