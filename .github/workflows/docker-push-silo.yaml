name: '[backend] Docker build Silo'

on:
  push:
    branches:
      - develop
    paths:
      - 'install/local/silo/*'
      - '.github/workflows/docker-push-silo.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: scpwiki/wikijump
  DESCRIPTION: Modified version of Silo for integration testing
  TAG: minio

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Log in to the Container registry
        uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: metadata
        uses: docker/metadata-action@1ec73021df0717d8bef7700a897c064453280439
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TAG }},enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=${{ env.DESCRIPTION }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@701ce7f32c417b7cd6138a18eb2da89f834fa296
        with:
          file: install/local/silo/Dockerfile
          context: install/local/silo
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: ${{ github.ref == 'refs/heads/develop' }}
