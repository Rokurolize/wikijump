name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
  merge_group:
  push:
    branches:
      - develop
      - prod
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci-push-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI / gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Local-validation-only policy
        run: |
          printf '%s\n' \
            'GitHub CI intentionally runs no tests, linters, builds, package installs, browser suites, or compatibility verification.' \
            'All validation is performed in the maintained WSL workspace.' \
            'External compatibility acquisition is cache-first and is never a GitHub Actions operation.'
