name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
  merge_group:
  push:
    branches:
      - develop
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci-push-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI / gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Repository generated-contract consistency
        run: node install/local/wikidot-verification/scripts/verify-repository-generated-contracts.mjs
      - name: Local-validation policy
        run: |
          printf '%s\n' \
            'GitHub CI runs only repository-local generated-contract consistency; it installs no packages and performs no live compatibility acquisition.' \
            'Tests, linters, builds, browser suites, and full compatibility verification remain in the maintained WSL workspace.' \
            'External compatibility acquisition is cache-first and is never a GitHub Actions operation.'
