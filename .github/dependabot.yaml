# Config documentation: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#configuration-options-for-dependabotyml

version: 2
updates:
  # Frontend
  - package-ecosystem: npm
    directory: "/framerail"
    schedule:
      interval: weekly

  # DEEPWELL
  - package-ecosystem: cargo
    directory: "/deepwell"
    schedule:
      interval: weekly

  # WWS
  - package-ecosystem: cargo
    directory: "/wws"
    schedule:
      interval: weekly

  # Locale validator
  - package-ecosystem: cargo
    directory: "/locales/validator"
    schedule:
      interval: weekly

  # Locale typed generator
  - package-ecosystem: npm
    directory: "/locales/typed"
    schedule:
      interval: weekly

  # Theme Lab
  - package-ecosystem: npm
    directory: "/install/local/theme-lab"
    schedule:
      interval: weekly

  # Wikidot verification
  - package-ecosystem: npm
    directory: "/install/local/wikidot-verification"
    schedule:
      interval: weekly

  # Module template
  - package-ecosystem: npm
    directory: "/docs/module-template"
    schedule:
      interval: weekly
