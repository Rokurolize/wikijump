<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en">
  <head>
    <meta data-wikidot-document-language />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <script nonce="%sveltekit.nonce%">
      /*__WIKIDOT_REQUEST_INFO__*/
    </script>
    %sveltekit.head%
    <script nonce="%sveltekit.nonce%">
      const analyticsProfile = document.querySelector(
        'meta[name="wikidot-site-analytics-profile"][data-wikidot-site-analytics-valid="true"]'
      )?.content
      if (analyticsProfile) {
        var _gaq = (globalThis._gaq = globalThis._gaq || [])
        _gaq.push(["userTracker._setAccount", analyticsProfile])
        _gaq.push(["userTracker._trackPageview"])
      }
    </script>
  </head>
  <body id="html-body">
    %sveltekit.body%
  </body>
</html>
