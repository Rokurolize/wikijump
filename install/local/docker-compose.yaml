services:
  database:
    build:
      context: ../..
      dockerfile: install/local/postgres/Dockerfile
    environment:
      - "POSTGRES_DB=wikijump"
      - "POSTGRES_USER=wikijump"
      - "POSTGRES_PASSWORD=wikijump"
      - "POSTGRES_HOST_AUTH_METHOD=md5"
      - "POSTGRES_INITDB_ARGS=--locale en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 10s
      timeout: 5s
      retries: 6

  files:
    build: minio
    restart: unless-stopped
    environment:
      - "MINIO_ROOT_USER=minio"
      - "MINIO_ROOT_PASSWORD=defaultpassword"
      - "MINIO_REGION_NAME=local"
      - "INITIAL_BUCKETS=deepwell-files deepwell-text-blocks"
      - "DATA_DIR=/data"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - local-minio-data:/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3

  cache:
    build: valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - local-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  deepwell:
    build:
      context: ../..
      dockerfile: install/local/deepwell/Dockerfile
    ports:
      - "2747:2747"
    environment:
      - "DATABASE_URL=postgres://wikijump:wikijump@database/wikijump"
      - "REDIS_URL=redis://cache"
      - "S3_FILES_BUCKET=deepwell-files"
      - "S3_TEXT_BLOCKS_BUCKET=deepwell-text-blocks"
      - "S3_REGION_NAME=local"
      - "S3_PATH_STYLE=true"
      - "S3_CUSTOM_ENDPOINT=http://files:9000"
      - "S3_ACCESS_KEY_ID=minio"
      - "S3_SECRET_ACCESS_KEY=defaultpassword"
      - "DEEPWELL_BUILD_PROFILE=${DEEPWELL_BUILD_PROFILE:-debug}"
      - "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-4}"
      - "CARGO_INCREMENTAL=1"
      - "CARGO_TARGET_DIR=/src/target"
      - "RUSTFLAGS=${RUSTFLAGS:-}"
    volumes:
      - local-rust-1-95-0-target:/src/target
      - local-rust-1-95-0-cargo-registry:/usr/local/cargo/registry
      - local-rust-1-95-0-cargo-git:/usr/local/cargo/git
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 600s
      start_interval: 10s
    depends_on:
      cache:
        condition: service_healthy
      database:
        condition: service_healthy
      files:
        condition: service_healthy

  framerail:
    build:
      context: ../..
      dockerfile: install/local/framerail/Dockerfile
    ports:
      - "3393:3393"
    environment:
      - "DEEPWELL_HOST=deepwell"
      - "FRAMERAIL_MODE=${FRAMERAIL_MODE:-dev}"
      - "REDIS_URL=redis://cache"
      - "PNPM_HOME=/pnpm"
      - "PNPM_STORE_DIR=/pnpm/store"
    volumes:
      - local-node-24-18-0-pnpm-store:/pnpm
      - local-framerail-node-modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 120s
      timeout: 2s
      retries: 3
    depends_on:
      cache:
        condition: service_healthy
      deepwell:
        condition: service_started

  wws:
    build:
      context: ../..
      dockerfile: install/local/wws/Dockerfile
    ports:
      - "3466:3466"
    environment:
      - "ADDRESS=[::]:3466"
      - "DEEPWELL_URL=http://deepwell:2747"
      - "REDIS_URL=redis://cache"
      - "S3_FILES_BUCKET=deepwell-files"
      - "S3_TEXT_BLOCKS_BUCKET=deepwell-text-blocks"
      - "S3_REGION_NAME=local"
      - "S3_PATH_STYLE=true"
      - "S3_CUSTOM_ENDPOINT=http://files:9000"
      - "S3_ACCESS_KEY_ID=minio"
      - "S3_SECRET_ACCESS_KEY=defaultpassword"
      - "WWS_BUILD_PROFILE=${WWS_BUILD_PROFILE:-debug}"
      - "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-4}"
      - "CARGO_INCREMENTAL=1"
      - "CARGO_TARGET_DIR=/src/target"
      - "RUSTFLAGS=${RUSTFLAGS:-}"
    volumes:
      - local-rust-1-95-0-target:/src/target
      - local-rust-1-95-0-cargo-registry:/usr/local/cargo/registry
      - local-rust-1-95-0-cargo-git:/usr/local/cargo/git
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 600s
      start_interval: 10s
    depends_on:
      deepwell:
        condition: service_healthy
      cache:
        condition: service_healthy
      files:
        condition: service_healthy

  caddy:
    build:
      context: ../..
      dockerfile: install/local/caddy/Dockerfile
    volumes:
      - local-caddy-data:/data
      - local-caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 30s
      timeout: 2s
      retries: 3

volumes:
  local-caddy-data:
    name: local-caddy-data
  local-caddy-config:
    name: local-caddy-config
  local-postgres-data:
    name: local-postgres-data
  local-minio-data:
    name: local-minio-data
  local-valkey-data:
    name: local-valkey-data
  local-rust-1-95-0-target:
    name: local-rust-1-95-0-target
  local-rust-1-95-0-cargo-registry:
    name: local-rust-1-95-0-cargo-registry
  local-rust-1-95-0-cargo-git:
    name: local-rust-1-95-0-cargo-git
  local-node-24-18-0-pnpm-store:
    name: local-node-24-18-0-pnpm-store
  local-framerail-node-modules:
    name: local-framerail-node-modules
