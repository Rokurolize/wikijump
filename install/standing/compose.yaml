name: ${STANDING_PROJECT_NAME:?STANDING_PROJECT_NAME is required}

# Standing startup topology
#
# Only Caddy is attached to the Docker bridge and publishes host ports. Every
# other service shares Caddy's network namespace, so the Docker engine programs
# one veth/NAT endpoint instead of seven. Warm restarts were dominated by that
# per-container bridge/NAT programming, not by application initialization.
#
# Consequences, which are intentional for this topology:
#   * Inter-service traffic uses 127.0.0.1, not Compose service DNS.
#   * Caddy reaches the application upstreams through extra_hosts.
#   * Recreating Caddy restarts the services that share its namespace; routine
#     Tier 1 refreshes recreate only Deepwell/Framerail/WWS, so this does not
#     couple normal refreshes.
#   * The application services no longer expose host ports; inspect them from
#     inside the namespace (for example `docker compose exec caddy ...`).
#
# `WIKIJUMP_STARTUP_READINESS` makes Caddy/Framerail/WWS serve an explicit
# non-cacheable 503 until the real Deepwell RPC answers, then load the generated
# routes. Deepwell itself keeps its `depends_on` on the base services so
# migrations only run once the database is actually healthy.

x-runtime-labels: &runtime-labels
  com.rokurolize.wikijump.owner: standing-runtime-promotion
  com.rokurolize.wikijump.lifecycle: prepared-exact-merged-head
  com.rokurolize.wikijump.sha: ${STANDING_WIKIJUMP_SHA:?STANDING_WIKIJUMP_SHA is required}
  com.rokurolize.wikijump.ftml_sha: ${STANDING_FTML_SHA:?STANDING_FTML_SHA is required}
  com.rokurolize.wikijump.profile: production-build

services:
  database:
    image: ${STANDING_DATABASE_IMAGE:?STANDING_DATABASE_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    network_mode: "service:caddy"
    environment:
      POSTGRES_DB: wikijump
      POSTGRES_USER: wikijump
      POSTGRES_PASSWORD: wikijump
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --locale en_US.UTF-8
    volumes:
      - wikijump-standing-postgres-data:/var/lib/postgresql/data
    labels:
      <<: *runtime-labels
      com.rokurolize.wikijump.role: database
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 10s
      start_period: 30s
      start_interval: 500ms
      timeout: 5s
      retries: 6

  files:
    image: ${STANDING_FILES_IMAGE:?STANDING_FILES_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    network_mode: "service:caddy"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: defaultpassword
      MINIO_REGION_NAME: local
      INITIAL_BUCKETS: deepwell-files deepwell-text-blocks
      DATA_DIR: /data
    volumes:
      - wikijump-standing-files-data:/data
    labels:
      <<: *runtime-labels
      com.rokurolize.wikijump.role: files
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      start_period: 30s
      start_interval: 500ms
      timeout: 5s
      retries: 3

  cache:
    image: ${STANDING_CACHE_IMAGE:?STANDING_CACHE_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    network_mode: "service:caddy"
    volumes:
      - wikijump-standing-cache-data:/data
    labels:
      <<: *runtime-labels
      com.rokurolize.wikijump.role: cache
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      start_period: 30s
      start_interval: 500ms
      timeout: 5s
      retries: 3

  deepwell:
    image: ${STANDING_DEEPWELL_IMAGE:?STANDING_DEEPWELL_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    network_mode: "service:caddy"
    environment:
      DATABASE_URL: postgres://wikijump:wikijump@127.0.0.1:5432/wikijump
      REDIS_URL: redis://127.0.0.1:6379
      S3_FILES_BUCKET: deepwell-files
      S3_TEXT_BLOCKS_BUCKET: deepwell-text-blocks
      S3_REGION_NAME: local
      S3_PATH_STYLE: "true"
      S3_CUSTOM_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: defaultpassword
      DEEPWELL_RPC_TOKEN: ${DEEPWELL_RPC_TOKEN:?DEEPWELL_RPC_TOKEN is required}
      DEEPWELL_BUILD_PROFILE: release
    volumes:
      - type: bind
        source: ./deepwell/config.toml
        target: /etc/deepwell.toml
        read_only: true
    tmpfs:
      - /run:uid=1,gid=1,mode=755
    labels:
      <<: *runtime-labels
      com.rokurolize.wikijump.role: deepwell
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 600s
      start_interval: 500ms
    depends_on:
      cache:
        condition: service_healthy
      database:
        condition: service_healthy
      files:
        condition: service_healthy

  framerail:
    image: ${STANDING_FRAMERAIL_IMAGE:?STANDING_FRAMERAIL_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    network_mode: "service:caddy"
    environment:
      DEEPWELL_HOST: 127.0.0.1
      DEEPWELL_PORT: "2747"
      DEEPWELL_RPC_TOKEN: ${DEEPWELL_RPC_TOKEN:?DEEPWELL_RPC_TOKEN is required}
      FRAMERAIL_MODE: built
      FRAMERAIL_ENV: local
      FRAMERAIL_CSRF_CHECK_ORIGIN: "true"
      REDIS_URL: redis://127.0.0.1:6379
      WIKIJUMP_STARTUP_READINESS: "true"
    labels:
      <<: *runtime-labels
      com.rokurolize.wikijump.role: framerail
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('node:net');const socket=net.connect(3393,'127.0.0.1',()=>{socket.destroy();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1500)"]
      interval: 10s
      start_period: 30s
      start_interval: 500ms
      timeout: 2s
      retries: 60

  wws:
    image: ${STANDING_WWS_IMAGE:?STANDING_WWS_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    network_mode: "service:caddy"
    environment:
      ADDRESS: "[::]:3466"
      DEEPWELL_URL: http://127.0.0.1:2747
      DEEPWELL_RPC_TOKEN: ${DEEPWELL_RPC_TOKEN:?DEEPWELL_RPC_TOKEN is required}
      REDIS_URL: redis://127.0.0.1:6379
      S3_FILES_BUCKET: deepwell-files
      S3_TEXT_BLOCKS_BUCKET: deepwell-text-blocks
      S3_REGION_NAME: local
      S3_PATH_STYLE: "true"
      S3_CUSTOM_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: defaultpassword
      WWS_BUILD_PROFILE: release
    labels:
      <<: *runtime-labels
      com.rokurolize.wikijump.role: wws
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 600s
      start_interval: 500ms

  caddy:
    image: ${STANDING_CADDY_IMAGE:?STANDING_CADDY_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    extra_hosts:
      - "deepwell=127.0.0.1"
      - "framerail=127.0.0.1"
      - "wws=127.0.0.1"
    environment:
      DEEPWELL_RPC_TOKEN: ${DEEPWELL_RPC_TOKEN:?DEEPWELL_RPC_TOKEN is required}
      WIKIJUMP_STARTUP_READINESS: "true"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"
    volumes:
      - type: bind
        source: ./caddy/request.json
        target: /etc/caddy-request.json
        read_only: true
      - local-caddy-data:/data
      - local-caddy-config:/config
    labels:
      <<: *runtime-labels
      com.rokurolize.wikijump.role: caddy
    healthcheck:
      test: ["CMD-SHELL", "curl --insecure --fail --silent --show-error -I -H 'Host: scp-wiki.wikijump.localhost' https://localhost/-/health-check/caddy >/dev/null"]
      interval: 30s
      start_period: 60s
      start_interval: 500ms
      timeout: 2s
      retries: 3

networks:
  default:
    name: ${STANDING_NETWORK_NAME:?STANDING_NETWORK_NAME is required}

volumes:
  wikijump-standing-postgres-data:
    external: true
    name: wikijump-standing-postgres-data
  wikijump-standing-files-data:
    external: true
    name: wikijump-standing-files-data
  wikijump-standing-cache-data:
    external: true
    name: wikijump-standing-cache-data
  local-caddy-data:
    external: true
    name: local-caddy-data
  local-caddy-config:
    external: true
    name: local-caddy-config
