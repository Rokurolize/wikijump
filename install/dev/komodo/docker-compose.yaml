# See https://komo.do/docs/setup/ferretdb for more information

services:
  postgres:
    # Pin to a specific version. Updates can be breaking.
    # https://github.com/FerretDB/documentdb/pkgs/container/postgres-documentdb
    image: ghcr.io/ferretdb/postgres-documentdb:17
    init: true
    restart: unless-stopped
    labels:
      # Prevent Komodo from stopping with StopAllContainers
      komodo.skip:
    volumes:
      - ferretdb-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DB_PASSWORD}
      POSTGRES_DB: postgres

  ferretdb:
    # Likewise here, pin a version.
    # https://github.com/FerretDB/FerretDB/pkgs/container/ferretdb
    image: ghcr.io/ferretdb/ferretdb:2.5
    init: true
    restart: unless-stopped
    labels:
      komodo.skip:
    depends_on:
      - postgres
    links:
      - postgres
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@postgres:5432/postgres

  core:
    image: ghcr.io/moghtech/komodo-core:latest
    init: true
    restart: unless-stopped
    labels:
      komodo.skip:
    depends_on:
      - ferretdb
    links:
      - ferretdb
    # Bare publication preserves the deployment posture; whether this port
    # also binds IPv6 depends on the Docker daemon's ipv6 and ip6tables settings.
    ports:
      - 9120:9120
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - /var/lib/komodo/backups:/backups
    extra_hosts:
      - host.docker.internal:host-gateway

  periphery:
    # NOTE: If not using AWS ECR, then replace this 'build' section with
    # simply 'image: ghcr.io/moghtech/komodo-periphery:latest'
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/moghtech/komodo-periphery:latest
        RUN apt-get update && \
          apt-get install -y amazon-ecr-credential-helper && \
          apt-get install -y docker-buildx-plugin docker-ce-cli docker-compose-plugin
    init: true
    restart: unless-stopped
    labels:
      komodo.skip:
    env_file: ./compose.env
    environment:
      AWS_ACCESS_KEY_ID: ${ECR_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${ECR_AWS_SECRET_ACCESS_KEY}
    volumes:
      ## Mount external docker socket and procfs
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /root/.docker/config.json:/root/.docker/config.json:ro
      ## Specify the Periphery agent root directory
      # Must be the same inside and outside the container.
      - /etc/komodo:/etc/komodo

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd7a:4f2c:9100:3::/64"

volumes:
  ferretdb-postgres:
  ferretdb-state:
