[logger]
enable = true
level = "info"

[server]
address = "[::]:2747"
pid-file = ""

[database]
run-seeder = false
seeder-path = "seeder"
# Connection fan-out (PLAN-memory-reduction phase 3, intervention 4).
# PostgreSQL allows 100 connections by default and each one is a backend
# process with its own catalog, plan, and prepared-statement caches. 32 is far
# above the 12 connections measured on standing at idle, and leaves room for
# the render-ahead container's own pool inside the database's max_connections.
max-connections = 32
statement-cache-capacity = 32
max-lifetime-secs = 1800

[security]
authentication-fail-delay-ms = 100

[security.session]
token-prefix = "wj:"
token-length = 64
duration-session-minutes = 30
duration-login-minutes = 5

[security.mfa]
recovery-code-count = 4
recovery-code-length = 8
mfa-digits = 6
time-step = 30
time-skew = 1

[domain]
main = "wikijump.com"
https-port = 443
files = "wjfiles.com"

[job]
workers = 2
max-attempts = 3
delay-ms = 5
min-delay-poll-secs = 10  # 10 seconds
max-delay-poll-secs = 360  # 6 minutes
prune-session-secs = 300  # 5 minutes
prune-upload-secs = 300  # 5 minutes
prune-text-secs = 86400  # 1 day
name-change-refill-secs = 86400  # 1 day
lift-expired-punishments-secs = 86400  # 1 day

[locale]
path = "/opt/locales"

[ftml]
render-timeout-ms = 2000
preprocess-timeout-ms = 500
# Bound concurrent blocking renders (PLAN-memory-reduction phase 4,
# intervention 6). 8 is about the CPU quota of the small-node target with room
# for the default render-ahead concurrency to queue rather than fail. A timed
# out render keeps its slot until the blocking thread finishes. The queue wait
# is outside the render timeout, so queueing never changes which pages hit the
# Wikidot-compatible render timeout.
render-concurrency = 8
render-queue-timeout-ms = 30000
rerender-skip = [
    { job-depth = 3, last-update-ms = 100 },
    { job-depth = 10, last-update-ms = 1500 },
    { job-depth = 50, last-update-ms = 0 },
]
[ftml.layout]
messages = "wikijump"
default-page = "wikidot"

[blueprint]
page-prefix = "_"
template = "_template"
missing = "_404"
private = "_public"
banned = "_ban"

[user]
default-name-changes = 2
maximum-name-changes = 3
minimum-name-bytes = 4
minimum-name-chars = 2
allow-registration = true
refill-name-change-days = 90

[email]
mock-mailcheck = false
automation-address = "noreply@wikijump.com"
notification-address = "notifications@wikijump.com"
newsletter-address = "newsletter@wikijump.com"

[file]
presigned-path-length = 32
presigned-expiration-minutes = 5
maximum-blob-size-kb = 1048576  # 1 GiB
maximum-avatar-size-kb = 100  # 100 KiB

[message]
maximum-subject-bytes = 128
maximum-body-bytes = 200000
maximum-recipients = 6
