[package]
name = "wws"
description = "Wilson's Web Server - Serves a zoo of user-generated content"
repository = "https://github.com/scpwiki/wikijump/tree/develop/wws"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = ["wikijump", "api", "backend", "wiki"]
categories = ["asynchronous", "caching", "web-programming::http-server"]
exclude = [".gitignore"]

version = "2026.3.21"
authors = ["Emmie Smith <emmie.maeda@gmail.com>"]
edition = "2024"
rust-version = "1.95.0"

[dependencies]
accept-language = "3"
anyhow = "1"
axum = { version = "0.8", features = ["http1", "http2", "macros", "tokio", "tower-log", "tracing"], default-features = false }
axum-extra = { version = "0.12", features = ["typed-header"] }
clap = "4"
color-backtrace = "0.7"
dotenvy = "0.15"
headers = "0.4"
httpdate = "1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jsonrpsee = { version = "0.26", features = ["async-client", "jsonrpsee-http-client"] }
paste = "1"
rand = "0.10"
redis = { version = "1", features = ["aio", "connection-manager", "tokio-comp", "tokio-rustls-comp"], default-features = false }
ref-map = "0.2"
rust-s3 = { version = "0.37", features = ["with-tokio", "tokio-rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
str-macro = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "serde"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower-http = { version = "0.7.0", features = ["add-extension", "compression-br", "compression-deflate", "compression-gzip", "compression-zstd", "normalize-path", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wikidot-normalize = "0.12"

[build-dependencies]
built = { version = "0.8", features = ["git2"] }

[dev-dependencies]
jsonrpsee-types = "0.26"
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time"] }

# Lints

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[package.metadata.cargo-machete]
ignored = ["rust-s3"]  # renamed to s3

# Keep ordinary development and test artifacts bounded. Full debug information
# is opt-in through `cargo --profile debugging` below.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
