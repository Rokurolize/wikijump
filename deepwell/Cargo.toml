[package]
name = "deepwell"
default-run = "deepwell"
description = "DEEPWELL - Wikijump API provider and database manager"
repository = "https://github.com/Rokurolize/wikijump/tree/develop/deepwell"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = ["wikijump", "api", "backend", "wiki"]
categories = ["asynchronous", "database", "web-programming::http-server"]
exclude = [".gitignore", ".editorconfig"]

version = "2026.10.27"
authors = ["Rokurolize <1701388+Rokurolize@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.95.0"

[features]
watch = ["notify"]

[dependencies]
argon2 = "0.6.0-rc.8"
arraystring = "0.3"
askama = "0.16"
bytes = "1"
clap = "4"
color-backtrace = "0.7"
cuid2 = "0.1"
data-encoding = "2"
dotenvy = "0.15"
diff = "0.1"
exn = "0.3"
femme = "2"
filemagic = "0.13"
fluent = "0.17"
fluent-syntax = "0"
ftml = { git = "https://github.com/Rokurolize/ftml", rev = "8b8f28ffd25549d8efb9c320b3b260fa444ff03e" }
futures = { version = "0.3", features = ["async-await"], default-features = false }
hex = { version = "0.4", features = ["serde"] }
hostname = "0.4"
intl-memoizer = "0.5"
http = "1.4"
jsonrpsee = { version = "0.26", features = ["macros", "server"] }
tower = "0.5"
log = "0.4"
notify = { version = "8", optional = true }
paste = "1"
rand = "0.10"
quick-xml = "0.42"
redis = { version = "1", features = ["aio", "connection-manager", "tokio-comp", "tokio-rustls-comp"] }
ref-map = "0.2"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rsmq_async = "18"
rust-s3 = { version = "0.38", features = ["with-tokio", "tokio-rustls-tls-ring"], default-features = false }
rust-otp = "3"
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "postgres-array", "stream", "macros", "with-json", "with-time", "with-ipnetwork"], default-features = false }
sea-query = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.11"
static_assertions = "1.1"
str-macro = "1"
strum = "0.28"
strum_macros = "0.28"
subtle = "2.6"
time = { version = "0.3", features = ["macros", "parsing", "serde"], default-features = false }
tiny-keccak = { version = "2", features = ["k12"] }
toml = { version = "1.1", features = ["parse"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
typenum = "1"
uuid = { version = "1", features = ["v4"] }
unic-langid = "0.9"
unicase = "2"
wikidot-normalize = "0.12"
wikidot-path = "0.6"
arrayvec = "0.7.6"

# Local crates
deepwell-relation-impl-derive = { path = "relation-impl-derive" }

[dev-dependencies]
ftml = { git = "https://github.com/Rokurolize/ftml", rev = "8b8f28ffd25549d8efb9c320b3b260fa444ff03e", features = ["test-support"] }
maplit = "1"
pretty_assertions = "1"
self_cell = "1"

[build-dependencies]
built = { version = "0.8", features = ["chrono"] }

# Lints

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
large_enum_variant = "allow"

[package.metadata.cargo-machete]
ignored = ["rust-s3"]  # renamed to s3

# Performance options

[profile.release]
lto = true

# Standing promotion images: release optimisation without whole-program LTO,
# which alone takes about 14 minutes for this crate, and with incremental
# compilation, so a source change rebuilds in minutes.
[profile.standing]
inherits = "release"
lto = false
incremental = true


# Keep ordinary development and test artifacts bounded. Full debug information
# is opt-in through `cargo --profile debugging` below.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Test runs render large documents and hash passwords; unoptimized
# dependencies (ftml, argon2) dominate the integration suite.
opt-level = 3

[profile.dev.package.deepwell]
opt-level = 1

# Procedural macros run while the compiler works, never while the tests run,
# so the optimisation level above buys nothing at test time and only costs
# build time. These packages are the exceptions to the wildcard.
[profile.dev.package.askama_macros]
opt-level = 0

[profile.dev.package.async-stream-impl]
opt-level = 0

[profile.dev.package.async-trait]
opt-level = 0

[profile.dev.package.const-random-macro]
opt-level = 0

[profile.dev.package.cssparser-macros]
opt-level = 0

[profile.dev.package.darling_macro]
opt-level = 0

[profile.dev.package.derive-where]
opt-level = 0

[profile.dev.package.derive_more-impl]
opt-level = 0

[profile.dev.package.displaydoc]
opt-level = 0

[profile.dev.package.enum-map-derive]
opt-level = 0

[profile.dev.package.futures-macro]
opt-level = 0

[profile.dev.package.jsonrpsee-proc-macros]
opt-level = 0

[profile.dev.package.lightningcss-derive]
opt-level = 0

[profile.dev.package.maybe-async]
opt-level = 0

[profile.dev.package.ouroboros_macro]
opt-level = 0

[profile.dev.package.paste]
opt-level = 0

[profile.dev.package.pastey]
opt-level = 0

[profile.dev.package.pest_derive]
opt-level = 0

[profile.dev.package.phf_macros]
opt-level = 0

[profile.dev.package.pin-project-internal]
opt-level = 0

[profile.dev.package.ptr_meta_derive]
opt-level = 0

[profile.dev.package.rkyv_derive]
opt-level = 0

[profile.dev.package.rustversion]
opt-level = 0

[profile.dev.package.sea-bae]
opt-level = 0

[profile.dev.package.sea-orm-macros]
opt-level = 0

[profile.dev.package.sea-query-derive]
opt-level = 0

[profile.dev.package.serde_derive]
opt-level = 0

[profile.dev.package.serde_repr]
opt-level = 0

[profile.dev.package.strum_macros]
opt-level = 0

[profile.dev.package.thiserror-impl]
opt-level = 0

[profile.dev.package.time-macros]
opt-level = 0

[profile.dev.package.tokio-macros]
opt-level = 0

[profile.dev.package.tracing-attributes]
opt-level = 0

[profile.dev.package.wasm-bindgen-macro]
opt-level = 0

[profile.dev.package.yoke-derive]
opt-level = 0

[profile.dev.package.zerofrom-derive]
opt-level = 0

[profile.dev.package.zerovec-derive]
opt-level = 0

# The pull request checks compile the library tests and Clippy, and never the
# integration suite, so they do not need the optimisation level that the
# integration suite's run time depends on. This profile builds the
# dependencies without optimisation, which is much cheaper to compile.
[profile.ci]
inherits = "dev"

[profile.ci.package."*"]
opt-level = 0

[profile.ci.package.deepwell]
opt-level = 1

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
